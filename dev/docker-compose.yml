version: "3.9"

services:
  safeflow-db-dev:
    build: .
    container_name: safeflow-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safeflow_db
    ports:
      - "5433:5432"
    volumes:
      - safeflow_pgdata_dev:/var/lib/postgresql/data

volumes:
  safeflow_pgdata_dev: